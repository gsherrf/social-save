<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Social Save — Save and organize your favorite social media content.">
  <title>Social Save</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="splash-screen">
    <div class="logo-container">
      <div class="logo-icon">
        <svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M14 10C14 8.89543 14.8954 8 16 8H40C41.1046 8 42 8.89543 42 10V46L28 38L14 46V10Z" 
                fill="url(#bookmark-gradient)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
          <defs>
            <linearGradient id="bookmark-gradient" x1="14" y1="8" x2="42" y2="46" gradientUnits="userSpaceOnUse">
              <stop stop-color="#60A5FA"/>
              <stop offset="1" stop-color="#3B82F6"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <h1 class="app-name">Social Save</h1>
      <p class="app-tagline">Your favorites, all in one place.</p>
    </div>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
  </div>
</body>
</html>
