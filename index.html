<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Social Save — Save and organize your favorite social media content.">
  <title>Social Save</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="splash-screen">
    <div class="logo-container">
      <div class="logo-icon">
        <svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M28 8L33.5 19.5L46 21.5L37 30.5L39 43L28 37L17 43L19 30.5L10 21.5L22.5 19.5L28 8Z" 
                fill="url(#star-gradient)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
          <defs>
            <linearGradient id="star-gradient" x1="10" y1="8" x2="46" y2="43" gradientUnits="userSpaceOnUse">
              <stop stop-color="#A78BFA"/>
              <stop offset="1" stop-color="#6366F1"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <h1 class="app-name">Social Save</h1>
      <p class="app-tagline">Your favorites, all in one place.</p>
    </div>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
  </div>
</body>
</html>
